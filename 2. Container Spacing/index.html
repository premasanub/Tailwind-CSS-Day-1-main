<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Container & Spacing</title>
    <style>
      body {
        padding: 5rem;
      }
    </style>
  </head>
  <body>
    <h1 class="text-2xl font-bold underline text-red-500">Containers and Spacing</h1>
    <!-- Margin -->
    <!-- https://tailwindcss.com/docs/margin -->
    
    <h1 class="text-2xl font-bold underline text-red-500">Margin</h1>
    <div class ="bg-yellow-300 m-16">all around</div>
    <div class ="bg-purple-400 my-8 ">Top&Bottom</div>
    <div class="bg-yellow-800 mx-10">left&right</div>
    <div class="bg-pink-800 mt-10">top</div>
    <div class="bg-yellow-600 mb-10">bottom</div>
    <div class="bg-gray-800 mr-10">right</div>
    <div class="bg-yellow-800 ml-10">left</div>
    <!-- Arbitrary/Custom Spacing -->
    
    <h1 class="text-2xl font-bold underline text-red-500">Aribitrary Values</h1>
    <div class="bg-slate-500 m-[50px]">Arbitary</div>
    
    <!-- Padding -->
    <!-- https://tailwindcss.com/docs/padding -->
    
    <h1 class="text-2xl font-bold underline text-red-500">Padding</h1>
  <div class="bg-yellow-300 p-10">Padding All around</div>
    <div class="bg-yellow-400 px-30">Padding X-axis</div>
    <div class="bg-yellow-500 py-10">Padding Y-axis</div>
    <div class="bg-yellow-600 pt-25">Padding Top</div>
    <div class="bg-yellow-700 pr-25">Padding Right</div>
    <div class="bg-yellow-800 pb-25">Padding Bottom</div>
    <div class="bg-yellow-900 pl-25">Padding Left</div>

    <!-- https://tailwindcss.com/docs/space -->
    <!-- Space Between X -->
   <h3 class="text-2xl font-bold underline text-red-500 mt-5">Space Between X</h3>
 <div class="flex space-x-4">
  <div class="bg-red-600 p-4">1</div>
  <div class="bg-red-600 p-4">2</div>
  <div class="bg-red-600 p-4">3</div>
 </div>
    <!-- Space Between Y -->
    <h3 class="text-2xl font-bold underline text-red-500 mt-5">Space Between Y</h3>
  <div class="flex-col space-y-4">
  <div class="bg-red-600 p-5  mr-320 text-center">1</div>
  <div class="bg-red-600 p-4">2</div>
  <div class="bg-red-600 p-4">3</div>
 </div>
  </body>
</html>
